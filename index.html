<!-- 1. ПОДКЛЮЧАЕМ FIREBASE SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE ⚠️
    const firebaseConfig = {
        apiKey: "ВАШ_API_KEY",
        authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
        projectId: "ВАШ_ПРОЕКТ",
        storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
        messagingSenderId: "ВАШ_ID",
        appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveScore = async function() {
        const nameInput = document.getElementById("player-name").value.trim();
        const score = parseInt(document.getElementById("final-score").innerText);
        const total = window.currentTotal || 66;
        const category = window.currentCategory || "mixed";

        if (!nameInput) {
            alert("Пожалуйста, введите ваше имя!");
            return;
        }

        const btn = document.getElementById("save-score-btn");
        btn.disabled = true;
        btn.innerText = "Сохранение...";

        try {
            await addDoc(collection(db, "leaderboard"), {
                name: nameInput,
                score: score,
                total: total,
                category: category,
                timestamp: new Date()
            });

            document.getElementById("result-section").style.display = "none";
            document.getElementById("leaderboard-section").style.display = "block";

            loadLeaderboard();
        } catch (e) {
            console.error("Ошибка добавления документа: ", e);
            alert("Ошибка сохранения. Проверьте настройки Firebase.");
            btn.disabled = false;
            btn.innerText = "Сохранить в таблицу лидеров";
        }
    };

    async function loadLeaderboard() {
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Загрузка...</td></tr>";

        try {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
            const querySnapshot = await getDocs(q);

            tbody.innerHTML = "";

            if (querySnapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Пока нет результатов. Будьте первым!</td></tr>";
                return;
            }

            let rank = 1;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const total = data.total || 66;
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${rank}</td>
                    <td>${data.name}</td>
                    <td>${data.score} / ${total}</td>
                `;
                tbody.appendChild(tr);
                rank++;
            });
        } catch (e) {
            console.error("Ошибка загрузки: ", e);
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>Ошибка загрузки данных</td></tr>";
        }
    }
</script>

    window.currentCategory = 'mixed';

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

            pendingTimeout = null;

        currentQuestionIndex = 0;

    function initQuiz() {
        let docQuestions = [];
        let holidayQuestions = [];

        if (selectedCategory === 'mixed' || selectedCategory === 'numbers') {
            documents.forEach(doc => {
                const wrongOptions = documents
                    .filter(d => d.id !== doc.id)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(d => d.title);

                docQuestions.push({
                    text: `Какой документ имеет номер <b>${doc.id}</b>?`,
                    correctAnswer: doc.title,
                    options: shuffle([doc.title, ...wrongOptions])
                });
            });
        }

        if (selectedCategory === 'mixed' || selectedCategory === 'dates') {
            holidaysData.forEach(h => {
                const askForDate = Math.random() > 0.5;
                if (askForDate) {
                    const wrongDates = holidaysData
                        .filter(item => item.date !== h.date)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(item => item.date);

                    holidayQuestions.push({
                        text: `Когда отмечается <b>${h.name}</b>?`,
                        correctAnswer: h.date,
                        options: shuffle([h.date, ...wrongDates])
                    });
                } else {
                    const wrongNames = holidaysData
                        .filter(item => item.name !== h.name)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(item => item.name);

                    holidayQuestions.push({
                        text: `Какой праздник отмечается <b>${h.date}</b>?`,
                        correctAnswer: h.name,
                        options: shuffle([h.name, ...wrongNames])
                    });
                }
            });
        }

        shuffle(docQuestions);
        shuffle(holidayQuestions);

        let combinedQuestions = [];

        if (selectedCategory === 'mixed') {
            let maxLength = Math.max(docQuestions.length, holidayQuestions.length);
            for (let i = 0; i < maxLength; i++) {
                if (i < docQuestions.length) combinedQuestions.push(docQuestions[i]);
                if (i < holidayQuestions.length) combinedQuestions.push(holidayQuestions[i]);
            }
        } else if (selectedCategory === 'numbers') {
            combinedQuestions = docQuestions;
        } else {
            combinedQuestions = holidayQuestions;
        }

        finalQuestions = shuffle(combinedQuestions);
        window.currentTotal = finalQuestions.length;
        document.getElementById("total-questions").innerText = finalQuestions.length;

        showQuestion();
    }

    function showQuestion() {
        if (currentQuestionIndex >= finalQuestions.length) {
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("result-section").style.display = "block";
            document.getElementById("final-score").innerText = score;
            return;
        }

        const q = finalQuestions[currentQuestionIndex];
        document.getElementById("question-counter").innerText = `Вопрос ${currentQuestionIndex + 1} из ${finalQuestions.length}`;
        document.getElementById("question-text").innerHTML = q.text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(option => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, q.correctAnswer);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOption, correctAnswer) {
        const allButtons = document.querySelectorAll("#options-container button");
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedOption === correctAnswer) {
            selectedBtn.classList.add("correct");
            score++;
            document.getElementById("score").innerText = `Счет: ${score}`;
            pendingTimeout = setTimeout(nextQuestion, 500);
        } else {
            selectedBtn.classList.add("incorrect");
            allButtons.forEach(btn => {
                if (btn.innerText === correctAnswer) {
                    btn.classList.add("correct");
                }
            });
            pendingTimeout = setTimeout(nextQuestion, 3000);
        }
    }

    function nextQuestion() {
        pendingTimeout = null;
        currentQuestionIndex++;
        showQuestion();
    }

    // Тест стартует только после клика по кнопке категории
</script>

</body>
</html>
